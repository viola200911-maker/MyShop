{% load static %}
<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Адмін-панель — MyShop{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background-color: #f8f9fa;
        }

        .sidebar {
            min-height: 100vh;
            background-color: #212529;
        }

        .sidebar .nav-link {
            color: rgba(255, 255, 255, 0.75);
            padding: 0.8rem 1rem;
            border-radius: 0.375rem;
            margin-bottom: 0.2rem;
        }

        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            color: #fff;
            background-color: rgba(255, 255, 255, 0.1);
        }

        .main-content {
            padding: 2rem;
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Сайдбар -->
            <nav class="col-md-3 col-lg-2 d-md-block sidebar p-3 text-white">
                <a href="{% url 'admin_panel:dashboard' %}"
                    class="d-flex align-items-center mb-4 text-white text-decoration-none fs-4 fw-bold">
                    ⚙️ AdminPanel
                </a>
                <hr class="text-secondary">
                <ul class="nav nav-pills flex-column mb-auto">
                    <li class="nav-item">
                        <a href="{% url 'admin_panel:dashboard' %}"
                            class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
                            📊 Дашборд
                        </a>
                    </li>
                    <li>
                        <a href="{% url 'admin_panel:admin_product_list' %}"
                            class="nav-link {% if 'product' in request.resolver_match.url_name %}active{% endif %}">
                            📦 Товари
                        </a>
                    </li>
                    <li>
                        <a href="{% url 'admin_panel:admin_order_list' %}"
                            class="nav-link {% if 'order' in request.resolver_match.url_name %}active{% endif %}">
                            🛒 Замовлення
                        </a>
                    </li>
                    <li>
                        <a href="{% url 'admin_panel:user_list' %}"
                            class="nav-link {% if 'user' in request.resolver_match.url_name %}active{% endif %}">
                            👥 Користувачі
                        </a>
                    </li>
                </ul>
                <hr class="text-secondary mt-auto">
                <div>
                    <a href="{% url 'home' %}" class="btn btn-outline-light btn-sm w-100 mb-2">🛍️ На сайт</a>
                </div>
            </nav>

            <!-- Основний контент -->
            <main class="col-md-9 ms-sm-auto col-lg-10 main-content">
                {% if messages %}
                <div class="messages-container mb-3">
                    {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                    {% endfor %}
                </div>
                {% endif %}

                {% block content %}
                {% endblock %}
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
