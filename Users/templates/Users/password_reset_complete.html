{% extends 'base.html' %}

{% block title %}Пароль змінено — MyShop{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 rounded-3 text-center p-4">
            <div class="display-4 text-success mb-3">✅</div>
            <h3 class="fw-bold mb-3">Пароль успішно змінено!</h3>
            <p class="text-muted mb-4">
                Ваш пароль оновлено. Тепер ви можете увійти в систему за допомогою нових даних.
            </p>
            <a href="{% url 'login' %}" class="btn btn-primary btn-lg fw-semibold w-100">
                Увійти в акаунт
            </a>
        </div>
    </div>
</div>
{% endblock %}
